name: Build APK

# 构建入口（消灭"每次手动发 APK"）：
# - push 到 main / 打 tag 自动构建
# - 手动触发（Actions 页 → Build APK → Run workflow）随时出包
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses + ensure platform/build-tools
        # AGP 会在构建时自动下载缺失组件；先把 licenses 全接受掉避免构建卡在确认
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || echo "SDK 组件延迟到 Gradle 自动装"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ORG_GRADLE_PROJECT_CACHE_FIX: "1"

      - name: Rename APK (带 commit/时间)
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/codetool-debug-$COMMIT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetool-debug-apk
          path: |
            app/build/outputs/apk/debug/codetool-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to release (tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/codetool-debug-*.apk
          generate_release_notes: true
name: Build APK

# 构建入口（消灭"每次手动发 APK"）：
# - push 到 main / 打 tag 自动构建
# - 手动触发（Actions 页 → Build APK → Run workflow）随时出包
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # tag 时 softprops/action-gh-release 创建 Release 需写权限（read 会 403）
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        # android-actions/setup-android@v3 在部分 runner 上不稳定，手动装 cmdline-tools 更可控
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT" || true
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdt
          mv /tmp/cmdt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        # 用固定 keystore 签名，保证 CI 打的包与本地包签名一致（跨环境/跨 runner 覆盖安装不冲突）。
        # 未配置 Secret 时直接跳过（空值），回退 AGP 默认 debug 签名。
        # 注意：secrets 上下文不能用在 if 里，只能在 env/run 中用。
        env:
          KEYSTORE_B64: ${{ secrets.CODETOOL_KEYSTORE_BASE64 }}
          # 缺省用 debug keystore 的固定密码/别名（私钥本身在 Secret 里，密码单独泄露也拿不到私钥）
          STORE_PW: ${{ secrets.CODETOOL_STORE_PW || 'codetool-debug' }}
          KEY_ALIAS: ${{ secrets.CODETOOL_KEY_ALIAS || 'codetool-debug' }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::没配置 CODETOOL_KEYSTORE_BASE64，将使用 AGP 默认 debug 签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > codetool-debug.jks
          sha256sum codetool-debug.jks
          [ -n "$STORE_PW" ] || { echo "::error::CODETOOL_STORE_PW 为空且默认值未生效"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::CODETOOL_KEY_ALIAS 为空"; exit 1; }
          if ! keytool -list -keystore codetool-debug.jks -storepass "$STORE_PW" > /tmp/ks.txt 2>&1; then
            echo "::error::keystore 无法用 CODETOOL_STORE_PW 打开（文件或密码不对）"
            tail -3 /tmp/ks.txt | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          grep -q "PrivateKeyEntry" /tmp/ks.txt || echo "::error::keystore 里没有私钥条目"

      - name: Build debug APK
        id: build
        # 失败不立即中断，先让下一步把关键错误写成注解（Annotations），便于无日志权限时定位
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          # ORG_GRADLE_PROJECT_ 前缀 = Gradle 项目属性（等价 -P）
          ORG_GRADLE_PROJECT_CODETOOL_KEYSTORE: codetool-debug.jks
          ORG_GRADLE_PROJECT_CODETOOL_STORE_PW: ${{ secrets.CODETOOL_STORE_PW || 'codetool-debug' }}
          ORG_GRADLE_PROJECT_CODETOOL_KEY_ALIAS: ${{ secrets.CODETOOL_KEY_ALIAS || 'codetool-debug' }}
          ORG_GRADLE_PROJECT_CODETOOL_KEY_PW: ${{ secrets.CODETOOL_KEY_PW || 'codetool-debug' }}

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle 构建失败，关键行如下"
          grep -aiE "keystore|alias|signing|Execution failed|Caused by|error:" /tmp/build.log | tail -12 | while IFS= read -r l; do
            l=${l//'%'/'%25'}
            l=${l//$'\r'/}
            echo "::error::$l"
          done
          exit 1

      - name: Verify APK signature
        if: steps.build.outcome == 'success'
        # 校验 APK 真的用固定 keystore 签名（指纹不符直接失败，避免又发一趟签名不一致的包）
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "APK cert SHA-256 = $FP"
          if [ "$FP" = "eee3aaa50ba1ec68e38d5f66a192981e5e370c32d49181074d9fc1e814b4ec6b" ]; then
            echo "::notice::签名校验通过 CN=codetool debug SHA-256=$FP"
          else
            echo "::error::签名与预期不符: $FP"
            exit 1
          fi

      - name: Rename APK (带 commit/时间)
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/codetool-debug-$COMMIT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetool-debug-apk
          path: |
            app/build/outputs/apk/debug/codetool-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to release (tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/codetool-debug-*.apk
          generate_release_notes: true

      - name: Prune stale release assets
        # softprops 只追加不清理；重打同一个 tag 会残留旧 APK，这里只留本次构建产物
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=$(basename "$(ls app/build/outputs/apk/debug/codetool-debug-*.apk | head -1)")
          echo "保留: $KEEP"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while read -r n; do
            [ -z "$n" ] && continue
            if [ "$n" != "$KEEP" ]; then
              echo "删除旧附件: $n"
              gh release delete-asset "$GITHUB_REF_NAME" "$n" --yes
            fi
          done
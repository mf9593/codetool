name: Build APK

# 构建入口（消灭"每次手动发 APK"）：
# - push 到 main / 打 tag 自动构建
# - 手动触发（Actions 页 → Build APK → Run workflow）随时出包
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # tag 时 softprops/action-gh-release 创建 Release 需写权限（read 会 403）
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        # android-actions/setup-android@v3 在部分 runner 上不稳定，手动装 cmdline-tools 更可控
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT" || true
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdt
          mv /tmp/cmdt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        # 用固定 keystore 签名，保证 CI 打的包与本地包签名一致（跨环境/跨 runner 覆盖安装不冲突）。
        # 未配置 Secret 时直接跳过（空值），回退 AGP 默认 debug 签名。
        # 注意：secrets 上下文不能用在 if 里，只能在 env/run 中用。
        env:
          KEYSTORE_B64: ${{ secrets.CODETOOL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "没配置 CODETOOL_KEYSTORE_BASE64，将使用 AGP 默认 debug 签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > codetool-debug.jks
          ls -l codetool-debug.jks

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          # ORG_GRADLE_PROJECT_ 前缀 = Gradle 项目属性（等价 -P）
          ORG_GRADLE_PROJECT_CODETOOL_KEYSTORE: codetool-debug.jks
          ORG_GRADLE_PROJECT_CODETOOL_STORE_PW: ${{ secrets.CODETOOL_STORE_PW }}
          ORG_GRADLE_PROJECT_CODETOOL_KEY_ALIAS: ${{ secrets.CODETOOL_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CODETOOL_KEY_PW: ${{ secrets.CODETOOL_KEY_PW }}

      - name: Rename APK (带 commit/时间)
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/codetool-debug-$COMMIT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetool-debug-apk
          path: |
            app/build/outputs/apk/debug/codetool-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to release (tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/codetool-debug-*.apk
          generate_release_notes: true